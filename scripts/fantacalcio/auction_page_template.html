<title>Asta Fantacalcio 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#13161B;--surface:#1C2129;--surface2:#242A34;--line:#2E3642;
  --text:#ECEFF3;--muted:#8A94A6;--faint:#5C6675;
  --accent:#3DD68C;--accent-ink:#0B2A1B;--warn:#F2B84B;--bad:#EF6B5E;--plan:#5FA8F5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",-apple-system,"Helvetica Neue",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F5F2;--surface:#FFFFFF;--surface2:#EAEDE8;--line:#D6DAD2;
    --text:#171B22;--muted:#5D6672;--faint:#98A0AB;
    --accent:#1F9D63;--accent-ink:#FFFFFF;--warn:#B8791A;--bad:#C9402F;--plan:#2470C2;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F5F2;--surface:#FFFFFF;--surface2:#EAEDE8;--line:#D6DAD2;
  --text:#171B22;--muted:#5D6672;--faint:#98A0AB;
  --accent:#1F9D63;--accent-ink:#FFFFFF;--warn:#B8791A;--bad:#C9402F;--plan:#2470C2;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-weight:500}
button:focus-visible,input:focus-visible,li.row:focus-visible{outline:2px solid var(--plan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* scoreboard */
.board{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:end}
.board .left{font-family:var(--display);font-weight:700;font-size:54px;line-height:.9;letter-spacing:-.5px}
.board .left small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.board .left.low{color:var(--warn)} .board .left.neg{color:var(--bad)}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.slot{font-family:var(--display);font-size:20px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;min-width:58px;text-align:center}
.slot b{font-weight:500;color:var(--muted);font-size:14px;margin-right:4px}
.slot.full{border-color:var(--accent);color:var(--accent)}
.meta{grid-column:1/-1;display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--text);font-weight:600}
.meta b.good{color:var(--accent)} .meta b.warn{color:var(--warn)} .meta b.bad{color:var(--bad)}

/* tabs + search */
.tabs{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border-radius:999px;padding:7px 13px;font-size:13px;background:transparent}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{padding:8px 10px 4px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.hint{padding:2px 14px 6px;font-size:12px;color:var(--muted)}
.legend{padding:0 14px 6px;font-size:11px;color:var(--faint);display:flex;gap:12px}

/* rows */
ul.list{list-style:none;margin:0;padding:0 10px 90px}
li.row{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
li.row.t1{border-left-color:var(--accent)} li.row.t2{border-left-color:var(--plan)} li.row.t3{border-left-color:var(--faint)} li.row.t0{opacity:.55}
li.row .who b{font-weight:600;font-size:15px}
li.row .who span{display:block;font-size:12px;color:var(--muted)}
li.row .nums{font-family:var(--display);font-size:20px;font-weight:600;display:flex;gap:2px;align-items:baseline}
li.row .nums i{font-style:normal;color:var(--faint);font-size:14px;padding:0 2px}
li.row .nums .cap{color:var(--warn)} li.row .nums .hold{color:var(--muted)} li.row .nums .cap.up{color:var(--accent)}
li.row .need{font-size:11px;font-weight:600;color:var(--muted);min-width:34px;text-align:right}
li.row .need.hi{color:var(--accent)} li.row .need.mid{color:var(--plan)}
li.row.mine{background:color-mix(in srgb,var(--accent) 12%,transparent)}
li.row.mine .nums{color:var(--accent)}
li.row.gone{opacity:.42;text-decoration:line-through}
li.row .tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;background:var(--surface2);color:var(--muted)}
li.row .tag.inj{color:var(--bad)} li.row .tag.up{color:var(--accent)} li.row .tag.est{color:var(--warn)}
.empty{padding:30px 14px;color:var(--muted);text-align:center}

/* roster + log */
.group{padding:8px 14px 0;font-family:var(--display);font-size:22px;font-weight:600;display:flex;justify-content:space-between}
.group span{color:var(--muted);font-size:16px}
.total{padding:14px;font-family:var(--display);font-size:30px;font-weight:700;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px}
.logline{padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.logline span{color:var(--muted)}
.io{padding:12px 14px;display:grid;gap:8px}
.io textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:12px}
.io .btns{display:flex;gap:8px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:3px}
.sheet .note{margin:10px 0 0;font-size:14px;line-height:1.4}
.sheet .stat{margin:4px 0 0;font-size:12px;color:var(--muted)}
.sheet .stat.inj{color:var(--bad)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.grid4 div{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center}
.grid4 small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid4 b{font-family:var(--display);font-size:26px;font-weight:600}
.grid4 .capv b{color:var(--warn)} .grid4 .capv.up b{color:var(--accent)} .grid4 .maxv b{color:var(--plan)}
.price{display:flex;gap:8px;align-items:center;margin:6px 0}
.price input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-family:var(--display);font-size:34px;font-weight:600;text-align:center}
.price input.over{border-color:var(--bad);color:var(--bad)} .price input.atcap{border-color:var(--warn)}
.quick{display:flex;gap:6px;margin-bottom:10px}
.quick button{flex:1;padding:8px 0;font-size:13px}
.verdict{font-size:13px;font-weight:600;min-height:18px;margin:0 0 8px}
.verdict.ok{color:var(--accent)} .verdict.warn{color:var(--warn)} .verdict.bad{color:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .mine{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.actions .reset{grid-column:1/-1;background:transparent;color:var(--muted)}
.alts{margin-top:10px;font-size:12px;color:var(--muted)}
.alts b{color:var(--text);font-weight:500}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}}
@media (min-width:700px){#app{max-width:640px;margin:0 auto}.sheet{max-width:640px;margin:0 auto}}
</style>

<div id="app">
  <header class="board">
    <div class="left num" id="left">500<small>credits left</small></div>
    <div class="slots" id="slots"></div>
    <div class="meta">
      <span>max bid <b class="num" id="maxbid">—</b></span>
      <span>plan margin <b class="num" id="margin">—</b></span>
      <span>table inflation <b class="num" id="infl">—</b></span>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="plan">Plan</button>
    <button role="tab" data-tab="P">P</button>
    <button role="tab" data-tab="D">D</button>
    <button role="tab" data-tab="C">C</button>
    <button role="tab" data-tab="A">A</button>
    <button role="tab" data-tab="mine">My team</button>
    <button role="tab" data-tab="log">Log</button>
  </nav>
  <div class="search" id="searchwrap"><input id="q" type="search" placeholder="Search player or team" autocomplete="off"></div>
  <div class="legend" id="legend"><span>room → <span style="color:var(--warn)">pay to</span> → hold</span><span>need = importance</span></div>
  <div class="hint" id="hint"></div>
  <ul class="list" id="list"></ul>
</div>

<div class="veil" id="veil" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <h2 id="sName"></h2>
  <div class="sub" id="sSub"></div>
  <p class="note" id="sNote"></p>
  <div id="sHist"></div>
  <p class="stat" id="sCons"></p>
  <p class="stat" id="sFo"></p>
  <p class="stat inj" id="sInj"></p>
  <div class="grid4">
    <div><small>room</small><b class="num" id="sRoom"></b></div>
    <div class="capv" id="sCapBox"><small>pay to</small><b class="num" id="sCap"></b></div>
    <div><small>hold to</small><b class="num" id="sHold"></b></div>
    <div class="maxv"><small>max bid</small><b class="num" id="sMax"></b></div>
  </div>
  <div class="price"><input id="sPrice" type="number" inputmode="numeric" pattern="[0-9]*" min="1" placeholder="0"></div>
  <div class="quick">
    <button data-q="cap">= pay to</button><button data-q="hold">= hold</button><button data-q="+1">+1</button><button data-q="+5">+5</button>
  </div>
  <div class="verdict" id="sVerdict"></div>
  <div class="actions">
    <button class="mine" id="bMine">Mine at this price</button>
    <button id="bGone">Someone else took him</button>
    <button class="reset" id="bReset">Reset this player</button>
  </div>
  <div class="alts" id="sAlts"></div>
</section>

<script>
const DATA = /*__DATA__*/null;
const KEY = "asta2026:v1";
const ROLES = ["P","D","C","A"];
const byId = new Map(DATA.players.map(p => [p.id, p]));
let state = {mine:{}, gone:{}, log:[]};
try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let tab = "plan", query = "", current = null;
try { tab = localStorage.getItem(KEY+":tab") || "plan"; } catch (e) {}

// ---------- derived numbers ----------
function spent(){ return Object.values(state.mine).reduce((a,b)=>a+(+b||0),0); }
function slotsUsed(){ const u={P:0,D:0,C:0,A:0}; for (const id in state.mine){ const p=byId.get(+id); if(p) u[p.r]++; } return u; }
function slotsLeft(){ const u=slotsUsed(); const l={}; for(const r of ROLES) l[r]=Math.max(0, DATA.roster[r]-u[r]); return l; }
function totalSlotsLeft(){ const l=slotsLeft(); return ROLES.reduce((a,r)=>a+l[r],0); }
function left(){ return DATA.budget - spent(); }
function maxBid(){ return left() - Math.max(0, totalSlotsLeft()-1); }
function boosted(){ // alternatives of plan players taken by others
  const b = new Set();
  for (const id in state.gone){ const p=byId.get(+id); if(p && p.tier>=1 && p.tier<=2) for(const a of p.alts) b.add(a); }
  return b;
}
function effCap(p, b){ b = b || boosted(); return b.has(p.id) ? Math.max(p.cap, Math.ceil((p.cap+p.hold)/2)) : p.cap; }
function isOpen(p){ return !(p.id in state.mine) && !(p.id in state.gone); }
function planCost(){
  const l = slotsLeft(), b = boosted(); let cost = 0;
  for (const r of ROLES){
    const tgt = DATA.players.filter(p=>p.r===r && p.tier>=1 && p.tier<=2 && isOpen(p)).map(p=>effCap(p,b)).sort((x,y)=>y-x);
    for (let i=0;i<l[r];i++) cost += (i<tgt.length ? tgt[i] : 1);
  }
  return cost;
}
function inflation(){
  let paid=0, room=0;
  for (const id in state.gone){ const pr=+state.gone[id]; const p=byId.get(+id); if(pr>0 && p && p.room>0){ paid+=pr; room+=p.room; } }
  return room>0 ? paid/room : null;
}

// ---------- scoreboard ----------
function renderBoard(){
  const L = left(), el = document.getElementById("left");
  el.innerHTML = L + '<small>credits left</small>';
  el.className = "left num" + (L<0?" neg":(L<60?" low":""));
  const u = slotsUsed();
  document.getElementById("slots").innerHTML = ROLES.map(r=>`<div class="slot num${u[r]>=DATA.roster[r]?' full':''}"><b>${r}</b>${u[r]}/${DATA.roster[r]}</div>`).join("");
  document.getElementById("maxbid").textContent = totalSlotsLeft() ? maxBid() : "—";
  const m = L - planCost(); const me = document.getElementById("margin");
  me.textContent = (m>=0?"+":"") + m; me.className = "num " + (m>=10?"good":(m>=0?"warn":"bad"));
  const inf = inflation(); const ie = document.getElementById("infl");
  ie.textContent = inf==null ? "—" : "×"+inf.toFixed(2); ie.className = "num " + (inf==null?"":(inf>1.15?"bad":(inf>1.05?"warn":"good")));
}

// ---------- list ----------
function sortPlayers(a,b){
  const ta = a.tier===0?9:a.tier, tb = b.tier===0?9:b.tier;
  if (ta!==tb) return ta-tb;
  if (b.cap!==a.cap) return b.cap-a.cap;
  return b.room-a.room;
}
function rowHtml(p, b){
  const mine = p.id in state.mine, gone = p.id in state.gone;
  const cap = effCap(p,b), up = cap>p.cap;
  const needCls = p.need>=4?"hi":(p.need>=1?"mid":"");
  const tags = (p.inj?'<span class="tag inj">inj</span>':'') + (up?'<span class="tag up">alt ↑</span>':'') + (p.est?'<span class="tag est">est</span>':'');
  const price = mine ? `<span class="num">${state.mine[p.id]}</span>` : (gone && state.gone[p.id] ? `<span class="num">${state.gone[p.id]}</span>` : "");
  const nums = (mine||gone) ? price : `<span class="num">${p.room}</span><i>→</i><span class="cap num${up?' up':''}">${cap}</span><i>→</i><span class="hold num">${p.hold}</span>`;
  return `<li class="row t${p.tier}${mine?' mine':''}${gone?' gone':''}" data-id="${p.id}" tabindex="0">
    <div class="who"><b>${p.n}</b>${tags}<span>${p.t} · ${p.r} · ${p.min}′${mine?' · MINE':(gone?' · taken':'')}</span></div>
    <div class="nums">${nums}</div>
    <div class="need num ${needCls}">${p.need>0?p.need.toFixed(1):''}</div></li>`;
}
function renderList(){
  const list = document.getElementById("list"), b = boosted();
  const q = query.trim().toLowerCase();
  const hint = document.getElementById("hint");
  document.getElementById("searchwrap").hidden = (tab==="mine"||tab==="log");
  document.getElementById("legend").hidden = (tab==="mine"||tab==="log");
  if (tab==="mine"){ return renderMine(list); }
  if (tab==="log"){ return renderLog(list); }
  let ps = DATA.players.slice();
  if (q) ps = ps.filter(p => (p.n+" "+p.t).toLowerCase().includes(q));
  else if (tab==="plan") ps = ps.filter(p => p.tier>=1 && p.tier<=3);
  else ps = ps.filter(p => p.r===tab);
  ps.sort(sortPlayers);
  hint.textContent = tab==="plan" && !q ? "Green = core, blue = plan, grey = fallback. Tap a row to log a price." : (q ? `${ps.length} matches` : `${ps.filter(isOpen).length} still available`);
  list.innerHTML = ps.length ? ps.map(p=>rowHtml(p,b)).join("") : '<div class="empty">Nothing here.</div>';
}
function renderMine(list){
  let html = "", total = 0;
  for (const r of ROLES){
    const rows = DATA.players.filter(p=>p.id in state.mine && p.r===r).sort((a,b)=>state.mine[b.id]-state.mine[a.id]);
    const sub = rows.reduce((a,p)=>a+(+state.mine[p.id]),0); total += sub;
    html += `<div class="group"><span>${r} · ${rows.length}/${DATA.roster[r]}</span><span class="num">${sub}</span></div>`;
    html += rows.map(p=>rowHtml(p)).join("") || '<div class="hint">—</div>';
  }
  html += `<div class="total"><span>Spent</span><span class="num">${total} / ${DATA.budget}</span></div>`;
  document.getElementById("hint").textContent = "Tap a player to correct the price or remove him.";
  list.innerHTML = html;
}
function renderLog(list){
  const lines = state.log.slice().reverse().map(e=>{ const p=byId.get(e.id); if(!p) return "";
    const t = new Date(e.ts); const hh = t.getHours().toString().padStart(2,"0")+":"+t.getMinutes().toString().padStart(2,"0");
    const what = e.kind==="mine" ? `mine at ${e.price}` : (e.kind==="gone" ? `taken${e.price?' at '+e.price:''}` : "reset");
    return `<div class="logline"><span>${hh}</span><div><b>${p.n}</b> <span>${p.t} · ${p.r}</span></div><span class="num">${what}</span></div>`; }).join("");
  document.getElementById("hint").textContent = "Backup: copy the text below and paste it back on another device with Load.";
  list.innerHTML = (lines || '<div class="empty">No bids logged yet.</div>') +
    `<div class="io"><textarea id="io">${JSON.stringify({mine:state.mine,gone:state.gone,log:state.log})}</textarea>
     <div class="btns"><button id="bCopy">Copy backup</button><button id="bLoad">Load pasted backup</button><button id="bWipe">Wipe everything</button></div></div>`;
  document.getElementById("bCopy").onclick = async ()=>{ const ta=document.getElementById("io"); ta.select(); try{ await navigator.clipboard.writeText(ta.value); document.getElementById("bCopy").textContent="Copied"; }catch(e){ document.execCommand("copy"); } };
  document.getElementById("bLoad").onclick = ()=>{ try{ const s=JSON.parse(document.getElementById("io").value); if(s && s.mine){ state={mine:s.mine||{},gone:s.gone||{},log:s.log||[]}; save(); renderAll(); } }catch(e){ alert("That text is not a valid backup."); } };
  document.getElementById("bWipe").onclick = ()=>{ if(confirm("Delete every logged price?")){ state={mine:{},gone:{},log:[]}; save(); renderAll(); } };
}
function renderAll(){ renderBoard(); renderList(); }

// ---------- sheet ----------
function openSheet(id){
  const p = byId.get(id); if(!p) return; current = p;
  const cap = effCap(p);
  document.getElementById("sName").textContent = p.n;
  document.getElementById("sSub").textContent = `${p.t} · ${p.r} · ${p.min}′ projected · need ${p.need.toFixed(1)}` + (p.st!=="OK"?` · ${p.st}`:"") + (p.est?" · FVM estimated":"");
  document.getElementById("sNote").textContent = p.note;
  document.getElementById("sHist").innerHTML = (p.hist||[]).map(h=>'<p class="stat">'+h+'</p>').join("");
  document.getElementById("sCons").textContent = p.cons || "";
  document.getElementById("sFo").textContent = p.fo;
  document.getElementById("sInj").textContent = p.inj;
  document.getElementById("sRoom").textContent = p.room;
  document.getElementById("sCap").textContent = cap;
  document.getElementById("sCapBox").className = "capv" + (cap>p.cap?" up":"");
  document.getElementById("sHold").textContent = p.hold;
  document.getElementById("sMax").textContent = maxBid();
  const inp = document.getElementById("sPrice");
  inp.value = p.id in state.mine ? state.mine[p.id] : (state.gone[p.id] || cap || "");
  const alts = p.alts.map(a=>byId.get(a)).filter(Boolean).filter(isOpen);
  document.getElementById("sAlts").innerHTML = alts.length ? "If he goes past hold: " + alts.map(a=>`<b>${a.n}</b> (${a.t}, ${effCap(a)}→${a.hold})`).join(", ") : "";
  verdict();
  document.getElementById("veil").hidden = false; document.getElementById("sheet").hidden = false;
  setTimeout(()=>{ inp.focus(); inp.select(); }, 50);
}
function closeSheet(){ document.getElementById("veil").hidden = true; document.getElementById("sheet").hidden = true; current = null; }
function verdict(){
  const p = current; if(!p) return; const v = document.getElementById("sVerdict"), inp = document.getElementById("sPrice");
  const x = +inp.value || 0, cap = effCap(p), mb = maxBid();
  inp.className = "";
  if (!x){ v.textContent = ""; v.className = "verdict"; return; }
  if (x > mb){ v.textContent = `Over your max bid (${mb}) — you could not fill the roster.`; v.className="verdict bad"; inp.className="over"; return; }
  if (x > p.hold){ v.textContent = `Above hold (${p.hold}): let him go, take an alternative.`; v.className="verdict bad"; inp.className="over"; }
  else if (x > cap){ v.textContent = `Between pay-to and hold: fine if the plan margin stays ≥ 0.`; v.className="verdict warn"; inp.className="atcap"; }
  else { v.textContent = `At or under pay-to (${cap}): take him.`; v.className="verdict ok"; }
}
function logEvent(kind, id, price){ state.log.push({ts:Date.now(), id, kind, price: price||null}); if(state.log.length>600) state.log.shift(); }
document.getElementById("sPrice").addEventListener("input", verdict);
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{ const p=current; if(!p) return; const inp=document.getElementById("sPrice"); const q=b.dataset.q;
  if(q==="cap") inp.value=effCap(p); else if(q==="hold") inp.value=p.hold; else inp.value=(+inp.value||0)+(+q); verdict(); });
document.getElementById("bMine").onclick = ()=>{ const p=current; const x=+document.getElementById("sPrice").value; if(!p||!(x>0)) return;
  delete state.gone[p.id]; state.mine[p.id]=x; logEvent("mine",p.id,x); save(); closeSheet(); renderAll(); };
document.getElementById("bGone").onclick = ()=>{ const p=current; if(!p) return; const x=+document.getElementById("sPrice").value||null;
  delete state.mine[p.id]; state.gone[p.id]=x; logEvent("gone",p.id,x); save(); closeSheet(); renderAll(); };
document.getElementById("bReset").onclick = ()=>{ const p=current; if(!p) return; delete state.mine[p.id]; delete state.gone[p.id]; logEvent("reset",p.id); save(); closeSheet(); renderAll(); };
document.getElementById("veil").onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); if(e.key==="Enter" && current && document.activeElement===document.getElementById("sPrice")) document.getElementById("bMine").click(); });

// ---------- wiring ----------
document.getElementById("list").addEventListener("click", e=>{ const li=e.target.closest("li.row"); if(li) openSheet(+li.dataset.id); });
document.getElementById("list").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const li=e.target.closest("li.row"); if(li) openSheet(+li.dataset.id); } });
document.getElementById("q").addEventListener("input", e=>{ query=e.target.value; renderList(); });
document.querySelectorAll("#tabs button").forEach(b=>{ b.setAttribute("aria-selected", b.dataset.tab===tab);
  b.onclick=()=>{ tab=b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected", x===b)); try{localStorage.setItem(KEY+":tab",tab);}catch(e){} renderList(); window.scrollTo(0,0); }; });
renderAll();
</script>
